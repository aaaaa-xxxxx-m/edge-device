# 智能蜂箱 · 边缘设备配置示例
# 复制为 config.toml 后填写 device_name 与 api_key

# —— 设备（在云端管理端注册设备后获得 API Key）——
device_name = "hive001"
api_key = "bee_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
server_base_url = "http://8.156.79.6"

# —— 采样与模式 ——
normal_interval_s = 90    # 正常模式周期（保证在线，< 5 分钟）
collect_interval_s = 30   # 采集模式周期（有训练任务时加速采集）
sample_rate = 16000       # 与云端特征口径一致，勿改
audio_seconds = 6         # 每轮录音时长
dht_pin = 11              # DHT22 数据脚（BCM）
dht_sensor = "DHT22"
alsa_device = "plughw:1,0"  # USB 麦克风（用 `arecord -l` 查看）

# —— 本地文件（相对路径基于本配置文件所在目录）——
model_dir = "models"
state_file = "state.json"
public_key_file = "model_public_key.pem"

# —— 网络 ——
http_timeout_s = 20

# —— 日志 ——
log_level = "INFO"

# —— 显示（0 = 自适应 HDMI 分辨率）——
display_width = 0
display_height = 0
font_path = ""            # 留空自动查找 CJK 字体
